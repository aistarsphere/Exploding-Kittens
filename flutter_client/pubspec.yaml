name: exploding_kittens_client
description: Exploding Kittens Flutter mobile client
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  socket_io_client: ^2.0.3+1
  flutter_riverpod: ^2.6.1
  go_router: ^14.0.0
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  audioplayers: ^6.1.0
  lottie: ^3.1.3
  vibration: ^2.0.0
  intl: ^0.20.2
  percent_indicator: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
