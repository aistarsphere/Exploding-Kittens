# Render blueprint: single-service deploy.
# Runs Next.js (frontend) + Socket.IO (WebSocket server) in one process via server.ts.
# Everything lives at one URL — no Vercel, no env vars to wire up.
#
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: exploding-kittens
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
